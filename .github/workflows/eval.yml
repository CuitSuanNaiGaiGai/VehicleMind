name: Eval

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      judged:
        description: "同时运行 rubric 语义判分（额外的 judge API 费用）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline-injection-gate:
    name: Offline injection gate (promptfoo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked core environment
        run: uv sync --frozen --group dev

      - name: Verify promptfoo configs match frozen suites
        run: uv run --group dev python scripts/export_promptfoo_config.py --check

      - name: Run deterministic injection-gate eval
        run: npx --yes promptfoo@latest eval -c eval/promptfoo/injection_gate.yaml
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/.venv/bin/python

  online-golden-eval:
    name: Online golden eval (promptfoo, costs money)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked core environment
        run: uv sync --frozen --group dev

      - name: Run online golden eval against qwen and glm
        run: >-
          npx --yes promptfoo@latest eval
          -c eval/promptfoo/${{ inputs.judged && 'agent_eval_rubric' || 'agent_eval' }}.yaml
          -o runs/promptfoo/agent_eval.json
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/.venv/bin/python
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          VEHICLEMIND_JUDGE_PROVIDER: qwen

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results
          path: runs/promptfoo/
          if-no-files-found: error
