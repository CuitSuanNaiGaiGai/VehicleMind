name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked core environment
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run --group dev ruff check apps modules scripts tests

      - name: Type-check focused core boundaries
        run: >-
          uv run --group dev mypy
          modules/config
          modules/vehicle_ai/context/enums.py
          modules/vehicle_ai/integration/cabin_adapter.py
          scripts/verify_assets.py

      - name: Enforce source-size policy
        run: uv run --group dev python scripts/check_source_size.py

      - name: Validate model manifest schema
        run: >-
          uv run --group dev python scripts/verify_assets.py
          --schema-only

      - name: Run offline tests with coverage
        run: >-
          uv run --group dev python -m pytest
          -m "not hardware and not online"
          --cov=modules
          --cov-report=term-missing
          --cov-report=xml
          -q
