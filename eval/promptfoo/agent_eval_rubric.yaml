description: VehicleMind 金标集在线评测（含 rubric 语义判分）：判分与 batch_judge 共用同一协议；judge 调用产生额外真实 API 费用
prompts:
- '{{case_id}}'
providers:
- id: file://../../modules/vehicle_ai/evaluation/harness/provider.py
  label: qwen
  config:
    mode: agent_eval
    backend: qwen
    dataset_root: scenarios/agent_eval/golden
- id: file://../../modules/vehicle_ai/evaluation/harness/provider.py
  label: glm
  config:
    mode: agent_eval
    backend: glm
    dataset_root: scenarios/agent_eval/golden
defaultTest:
  assert:
  - type: python
    value: file://../../modules/vehicle_ai/evaluation/harness/assertions.py:assert_agent_case
    timeout: 300
  - type: python
    value: file://../../modules/vehicle_ai/evaluation/harness/assertions.py:assert_rubric_semantics
    timeout: 600
tests:
- description: C01 · cabin · dev
  vars:
    case_id: C01
    expected_json: '{"final_vehicle": {}, "forbidden_phrases": ["状态正常", "已经为你开启导航"], "required_facts": [], "tools": []}'
    dataset_root: scenarios/agent_eval/golden
