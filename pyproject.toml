[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vehiclemind"
version = "0.1.0"
description = "Perception-to-action vehicle AI research and engineering system"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=1,<3",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6,<7",
    "zhipuai>=2,<3",
]

[project.optional-dependencies]
perception = [
    "mediapipe==0.10.35",
    "numpy>=2.1,<3",
    "onnxruntime>=1.20,<2",
    "opencv-python>=4.10,<5",
    "torch>=2.6,<3",
    "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = [
  "hatchling>=1.27,<2",
  "mypy>=1.17,<2",
  "numpy>=2.1,<3",
  "opencv-python>=4.10,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "hardware: requires local cameras, model weights, or hardware acceleration",
    "online: requires an external API and credentials",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["models", "outputs", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["modules"]

[tool.coverage.report]
show_missing = true
skip_empty = true
