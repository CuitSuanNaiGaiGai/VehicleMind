reviewer: Codex AI self-review
method: schema_fact_tool_and_scenario_review
independent_human_review: false
decisions:
  C01: 疲劳高风险由舱内状态直接支持，不要求工具。
  C02: 正常低风险仅限当前观测，不外推长期安全。
  C03: 分心来自用户自述，不冒充算法识别标签。
  C04: 未检出驾驶员不等于现实中确定无人。
  C05: 眼部缺失时不能据此判断疲劳。
  C06: 哈欠证据与高层状态冲突时保留不确定性。
  R01: 中等车流只说明当前语义观测。
  R02: 车道未检出不等于道路不存在车道。
  R03: 可行驶区未检出不等于道路客观不可通行。
  R04: 行人与骑行者数量有来源，不臆测轨迹。
  R05: 设施只含数量，不含灯色或标志内容。
  R06: 逻辑时钟超过道路新鲜度阈值，随后注入无效收据。
  X01: 休息判断结合疲劳、道路和速度，禁止导航工具。
  X02: 疲劳观测与车辆驻车需同时表达。
  X03: 分心是用户自述，车道线未检出是道路观测。
  X04: 驾驶员正常不能抵消车道观测缺失。
  X05: 行人数量可引用，分心仍为用户自述。
  X06: 驾驶员未检出与驻车并列，疲劳未知。
  X07: 舱内观测超过两秒，道路观测保持有效。
  X08: 道路观测超过一秒，舱内高风险保持有效。
  X09: 高车流与速度共同提示，不虚构自动控制。
  X10: 三域总览分别引用舱内、道路与车辆字段。
  T01: 明确要求查询车辆状态，工具返回不改变状态。
  T02: 明确要求查询空调状态，不得自行打开。
  T03: 初始目标温度与请求目标不同，避免无动作歧义。
  T04: 开启空调需要 set_ac 真值并检查最终状态。
  T05: 歌曲查询字符串与媒体最终状态均可核对。
  T06: 暂停音乐只改变播放状态，不切换标题。
  T07: 音量目标在工具允许范围内，数值规范明确。
  T08: 只搜索服务区，待确认导航不等于已启动。
  T09: 车窗动作需确认，场景未确认时状态保持关闭。
  T10: 初始导航有效，取消后应回到 IDLE。
  M01: 搜索结果规范 ID 用于导航请求，确认后才执行。
  M02: 用户明确取消待确认导航，最终仍是 IDLE。
  M03: 用户明确要求重新搜索新目标，旧目标不得执行。
  M04: 非确认回复明确要求先别操作，不应执行敏感动作。
  M05: 确认时刻距前一请求超过 120 秒，待确认动作失效。
  M06: 注入查询工具错误，回答不得虚构成功读数。
  M07: 第二轮舱内状态已更新，应使用最新状态。
  M08: 温度调整后追问目标，必须依据最新车机状态。
