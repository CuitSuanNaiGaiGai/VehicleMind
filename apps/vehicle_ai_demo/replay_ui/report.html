<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VehicleMind 离线回放结果</title>
    <link rel="stylesheet" href="report.css">
    <script src="report.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">VEHICLEMIND · 离线证据</p>
        <h1>VehicleMind 离线回放结果</h1>
        <p id="scenario-description" class="subtitle"></p>
      </div>
      <div id="status-badge" class="status"></div>
    </header>

    <main>
      <section class="metrics" id="headline-metrics"></section>

      <section class="media-grid">
        <article class="panel">
          <div class="panel-title"><span>01</span> 舱内观测</div>
          <img id="cabin-media" alt="录制的舱内观测演示画面">
        </article>
        <article class="panel">
          <div class="panel-title"><span>02</span> 舱外道路观测</div>
          <img id="road-media" alt="录制的道路观测演示画面">
        </article>
      </section>

      <section class="context-grid" id="context-grid"></section>

      <section class="panel timeline-panel">
        <div class="panel-title"><span>03</span> 事件与动作时间线</div>
        <div id="timeline" class="timeline"></div>
      </section>

      <section class="split-grid">
        <article class="panel">
          <div class="panel-title"><span>04</span> 场景断言</div>
          <div id="assertions"></div>
        </article>
        <article class="panel">
          <div class="panel-title"><span>05</span> 来源与限制</div>
          <div id="provenance"></div>
          <ul id="limitations" class="limitations"></ul>
        </article>
      </section>
    </main>

    <script id="vehiclemind-data" type="application/json">__VEHICLEMIND_DATA__</script>
  </body>
</html>
