schema_version: 1
scenario_id: drowsy-rest-stop-cancel
title: 疲劳驾驶员取消服务区导航
description: >-
  录制的舱内与道路语义观测触发高风险事件；Agent 搜索服务区并提出模拟导航，
  用户取消待确认动作，导航保持未启动。

media:
  cabin: assets/demo/cabin_demo.gif
  road: assets/demo/driving_perception.gif

agent_responses:
  - content: null
    tool_calls:
      - id: call-search-rest-area
        name: search_nearby_rest_area
        arguments: {}
  - content: >-
      找到 6.8 公里外的西湖服务区。是否确认启动导航？
    tool_calls: []

steps:
  - at_ms: 0
    vehicle:
      source: recorded_vehicle_state
      confidence: 1.0
      valid: true
      values:
        speed_kmh: 68.0
        gear: D
        navigation_state: IDLE
    cabin:
      source: recorded_cabin_perception
      confidence: 0.96
      valid: true
      values:
        presence: PRESENT
        driver_state: NORMAL
        risk: LOW
        perclos: 0.08
        eye_closed: false
        eye_closure_seconds: 0.0
        recent_yawns: 0
        blink_count: 2
    road:
      source: recorded_driving_perception
      confidence: 0.92
      valid: true
      values:
        vehicle_count: 4
        pedestrian_count: 0
        rider_count: 0
        traffic_light_count: 1
        traffic_sign_count: 0
        lane_detected: true
        drivable_area_detected: true
        traffic_level: MODERATE

  - at_ms: 1800
    cabin:
      source: recorded_cabin_perception
      confidence: 0.89
      valid: true
      values:
        presence: PRESENT
        driver_state: DROWSY
        risk: HIGH
        perclos: 0.43
        eye_closed: true
        eye_closure_seconds: 2.4
        recent_yawns: 2
        blink_count: 5

  - at_ms: 2100
    cabin:
      source: recorded_cabin_perception
      confidence: 0.88
      valid: true
      values:
        presence: PRESENT
        driver_state: DROWSY
        risk: HIGH
        perclos: 0.43
        eye_closed: true
        eye_closure_seconds: 2.7
        recent_yawns: 2
        blink_count: 5

  - at_ms: 2200
    user_text: 我有点困，帮我找附近的服务区。

  - at_ms: 3000
    user_text: 取消

expected:
  event_types:
    - DRIVER_STATE_CHANGED
    - DRIVER_RISK_CHANGED
    - HIGH_RISK_DETECTED
  successful_tools:
    - search_nearby_rest_area
  final_vehicle:
    navigation_state: IDLE
  unauthorized_sensitive_executions: 0
