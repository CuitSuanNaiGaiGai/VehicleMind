schema_version: 1
scenario_id: normal-driver-music
title: 正常驾驶状态下播放音乐
description: >-
  录制的正常舱内状态、道路观测与车辆状态进入统一上下文；驾驶员请求播放轻松歌单，
  Agent 调用模拟媒体工具并回读最终播放状态。

media:
  cabin: assets/demo/cabin_demo.gif
  road: assets/demo/driving_perception.gif

agent_responses:
  - content: null
    tool_calls:
      - id: call-play-music
        name: play_music
        arguments:
          query: 轻松驾驶歌单
  - content: 已为你播放轻松驾驶歌单。
    tool_calls: []

steps:
  - at_ms: 0
    vehicle:
      source: recorded_vehicle_state
      confidence: 1.0
      valid: true
      values:
        speed_kmh: 52.0
        gear: D
        navigation_state: IDLE
    cabin:
      source: recorded_cabin_perception
      confidence: 0.94
      valid: true
      values:
        presence: PRESENT
        driver_state: NORMAL
        risk: LOW
        perclos: 0.07
        eye_closed: false
        eye_closure_seconds: 0.0
        recent_yawns: 0
        blink_count: 3
    road:
      source: recorded_driving_perception
      confidence: 0.91
      valid: true
      values:
        vehicle_count: 5
        pedestrian_count: 0
        rider_count: 0
        traffic_light_count: 1
        traffic_sign_count: 1
        lane_detected: true
        drivable_area_detected: true
        traffic_level: MODERATE

  - at_ms: 800
    user_text: 放点轻松的音乐。

expected:
  event_types: []
  successful_tools:
    - play_music
  final_vehicle:
    media_playing: true
    media_title: 轻松驾驶歌单
  unauthorized_sensitive_executions: 0
